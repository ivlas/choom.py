[project]
name = "choom-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["choom", "scripts"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["choom", "scripts/check_source.py"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RET",
    "SIM",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
